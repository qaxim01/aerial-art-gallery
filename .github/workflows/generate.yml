name: Generate Ambient Gallery Videos

on:
  schedule:
    - cron: '0 3 * * *' # Runs automatically every night at 3:00 AM UTC
  workflow_dispatch: # Allows manual trigger from GitHub Web UI anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests pillow

      - name: Execute Generator Script
        run: python generate_gallery.py

      - name: Commit and Push Video Gallery
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generated updated ambient videos" && git push)
